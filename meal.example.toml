# 한 끼 배식 설정. 복사해서 meal.toml로 쓰세요.

# ── 목표 영양성분 (한 끼 전체 합계) ─────────────────────────────
# min = 이 이상, max = 이 이하. 필요한 것만 적으면 됩니다.
# 쓸 수 있는 이름: 열량(kcal) 탄수화물 당류 단백질 지방 포화지방 트랜스지방(g) 콜레스테롤 나트륨(mg)
[targets]
"열량"   = { min = 500, max = 700 }
"단백질" = { min = 15 }
"나트륨" = { max = 900 }

# ── 상 위의 그릇. 화면 왼쪽에 있는 그릇부터 순서대로 ────────────
# food    : 식약처 DB에서 찾을 음식 이름
# type    : 아래 [bowl_types]의 이름
# density : g/mL (생략하면 settings.default_density)
# per100g : 직접 적은 100g당 영양성분. 적으면 DB보다 이 값을 먼저 씁니다.
#           (아래 값은 대략적인 예시입니다. 식약처 키가 있으면 지우고 DB값을 쓰세요.)
[[bowls]]
food = "쌀밥"
type = "밥그릇"
density = 0.85
per100g = { "열량" = 150, "탄수화물" = 33, "단백질" = 2.7, "지방" = 0.3, "나트륨" = 2 }

[[bowls]]
food = "된장찌개"
type = "국그릇"
density = 1.0
per100g = { "열량" = 45, "탄수화물" = 3.5, "단백질" = 3.2, "지방" = 1.8, "나트륨" = 480 }

# ── 그릇 모양 (안쪽 기준, 윗지름에 대한 비율) ────────────────────
# depth_ratio  : 깊이 / 윗지름
# bottom_ratio : 바닥 지름 / 윗지름
[bowl_types."밥그릇"]
depth_ratio = 0.43
bottom_ratio = 0.48

[bowl_types."국그릇"]
depth_ratio = 0.40
bottom_ratio = 0.45

[settings]
camera_height_mm = 600     # 카메라 렌즈 ~ 상판 거리. 그릇 윗면이 더 가까워 커 보이는 것을 보정
coin_diameter_mm = 26.5    # 500원 동전
default_density = 0.9
tolerance = 0.05           # 목표의 ±5% 안이면 적당하다고 봄
